# Build the pkgdown website and publish it to the gh-pages branch.
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deployment at a time; pull requests build but never deploy.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write   # needed to push the built site to gh-pages

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs the package itself (local::.) plus pkgdown and all
      # dependencies needed to knit the vignettes.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every top-level .md file as a page and has no option
      # to skip one. Remove the developer notes so they are not published.
      - name: Remove developer-only pages
        run: rm -f docs/AGENTS.html docs/AGENTS.md docs/PROJECT_NOTES.html docs/PROJECT_NOTES.md

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
