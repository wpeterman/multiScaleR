# Build the pkgdown website and publish it to the gh-pages branch.
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
name: pkgdown

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deployment at a time; pull requests build but never deploy.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write   # needed to push the built site to gh-pages

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs the package itself (local::.) plus pkgdown and all
      # dependencies needed to knit the vignettes.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every top-level .md file as a page and indexes its
      # text for the site search, with no option to skip a file. Remove the
      # developer notes, their search entries, and their sitemap entries so
      # that none of their text is published. jsonlite comes with pkgdown.
      - name: Remove developer-only pages
        shell: Rscript {0}
        run: |
          notes <- c("AGENTS", "PROJECT_NOTES")
          unlink(file.path("docs", paste0(notes, rep(c(".html", ".md"), each = 2))))
          pattern <- paste0("/(", paste(notes, collapse = "|"), ")[.]html")
          if (file.exists("docs/search.json")) {
            index <- jsonlite::read_json("docs/search.json")
            keep <- !vapply(index, function(e) any(grepl(pattern, unlist(e$path))), logical(1))
            jsonlite::write_json(index[keep], "docs/search.json", auto_unbox = TRUE, null = "null")
          }
          if (file.exists("docs/sitemap.xml")) {
            map <- paste(readLines("docs/sitemap.xml", warn = FALSE), collapse = "\n")
            map <- gsub(paste0("<url>[[:space:]]*<loc>[^<]*", pattern,
                               "</loc>[[:space:]]*</url>[[:space:]]*"), "", map)
            writeLines(map, "docs/sitemap.xml")
          }

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
