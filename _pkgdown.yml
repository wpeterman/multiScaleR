# pkgdown configuration for the multiScaleR website.
# Preview locally with pkgdown::build_site(); validate with pkgdown::check_pkgdown().
url: https://wpeterman.github.io/multiScaleR/

template:
  bootstrap: 5
  light-switch: true   # light/dark toggle in the navbar

# The package has no vignette named "multiScaleR", so pkgdown would not create
# a "Get started" link on its own. Point it at the quick-start vignette.
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/v01-quickstart.html

# Vignettes, grouped for the Articles menu and index page. The order follows
# the numbered file names: the quick start, the user guide, then by complexity.
# Every vignette must be listed here, or pkgdown::check_pkgdown() fails.
articles:
  - title: Getting started
    navbar: Getting started
    contents:
      - v01-quickstart
      - v02-user-guide
  - title: Covariates and maps
    navbar: Covariates and maps
    desc: >
      Map predictions, and use landscape metrics, surface texture, and
      year-specific rasters as scale-dependent covariates.
    contents:
      - v03-map-predictions
      - v04-landscape-metrics
      - v05-surface-metrics
      - v06-year-specific-rasters
  - title: Fitting and evaluation
    navbar: Fitting and evaluation
    desc: >
      Choose a fitting method, cross-validate models, and interpret estimates
      and intervals.
    contents:
      - v07-fitting-methods
      - v08-cross-validation
      - v09-estimates-and-intervals
  - title: Specialized models
    navbar: Specialized models
    desc: >
      Step-selection models, spatial response fields, and distance-removal
      surveys.
    contents:
      - v10-step-selection
      - v11-spatial-fields
      - v12-distance-removal
  - title: Bayesian scale estimation
    navbar: Bayesian scale estimation
    contents:
      - v13-bayesian-scales
      - v14-bayesian-prediction
      - v15-bayesian-computation

# Function reference, grouped by step in the analysis workflow.
# Every non-internal help topic must be listed here, or check_pkgdown() fails.
reference:
  - title: Concepts and objects
    desc: >
      Start here. Background on kernels, fitting methods, and predictions, a
      glossary of terms, and descriptions of the objects the main functions
      return.
    contents:
      - multiScaleR-package
      - "`multiScaleR-glossary`"
      - "`multiScaleR-kernels`"
      - "`multiScaleR-fitting-methods`"
      - "`multiScaleR-prediction`"
      - "`multiScaleR-class`"
      - "`multiScaleR_data-class`"
      - "`multiScaleR_bayes-class`"
      - "`multiScaleR_cv-class`"
  - title: Prepare inputs
    desc: >
      Build the kernel inputs and declare how each raster covariate is
      summarized before optimization.
    contents:
      - kernel_prep
      - kernel_prep_by_group
      - msr_vars
      - prepare_unmarked_data
      - validate_unmarked_data
      - estimate_multiscale_ram
  - title: Optimize scales of effect
    desc: >
      Estimate the scale of effect for each covariate by maximum likelihood
      and assess the fit.
    contents:
      - multiScale_optim
      - profile_sigma
      - scale_inference
      - multiScale_joint
      - footprint_sd
      - "`multiScaleR_joint-methods`"
      - diagnostics
      - vcov.multiScaleR
  - title: Bayesian scale estimation
    desc: >
      Estimate scales of effect with full posterior uncertainty.
    contents:
      - multiScale_bayes
      - check_bayes_setup
      - simulate_bayes_prior
      - posterior_scales
      - diagnose_bayes_scales
      - diagnose_bayes_probabilities
      - diagnose_bayes_laplace
      - plot.multiScaleR_bayes
      - simulate.multiScaleR_bayes
  - title: Summarize and compare models
    contents:
      - summary.multiScaleR
      - "`multiScaleR-methods`"
      - kernel_dist
      - aic_tab
      - bic_tab
      - starts_with("print")
  - title: Cross-validation
    contents:
      - cross_validate
      - cross_validate_glm
      - cross_validate_clogit
      - cross_validate_field
      - cross_validate_mixed
      - cross_validate_bayes
      - cv_tab
      - select_cv
      - grouped_cv_folds
      - spatial_cv_folds
  - title: Prediction and spatial projection
    desc: >
      Apply fitted scales to new observations and to rasters.
    contents:
      - kernel_scale.raster
      - prepare_prediction
      - predict_scales
      - predict.multiScaleR
      - predict.multiScaleR_bayes
      - prediction_contract
  - title: Distance-removal models
    desc: >
      Data preparation, fitting helpers, whole-survey predictions and
      simulations, and audits for generalized distance-removal (GDR) models,
      including spatial response fields.
    contents:
      - prepare_gdr_histories
      - prepare_gdr_intervals
      - expand_gdr_intervals
      - gdr_start_values
      - make_gdr_refitter
      - predict_gdistremoval
      - simulate_gdistremoval
      - fit_gdr_response_field
      - response_field_geometry
      - "`unmarkedFitGDRField-class`"
      - "`predict,unmarkedFitGDRField-method`"
      - "`vcov,unmarkedFitGDRField-method`"
  - title: Plot
    contents:
      - plot.multiScaleR
      - plot.sigma_profile
      - plot_kernel
      - plot_marginal_effects
  - title: Simulation
    contents:
      - sim_rast
      - sim_dat
      - sim_dat_unmarked
      - sim_dat_gdr
  - title: Example data
    contents:
      - count_data
      - landscape_counts
      - hab
      - landscape
      - pts
      - surv_pts
